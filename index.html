<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik dla gitarzysty</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      line-height: 1.6;
      font-family: monospace;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .controls button {
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .controls button:hover {
      background-color: #ddd;
    }

    .scroll-container {
        max-height: 700px;
        overflow: auto; /* Włącz przewijanie */
        position: relative;
        cursor: grab; /* Wskaźnik do przeciągania */
        min-width: 60%;
    }

    .scroll-container:active {
        cursor: grabbing; /* Zmień wskaźnik podczas przeciągania */
    }

    .chord {
      color: red;
      font-weight: bold;
    }

    .strumming {
      font-size: 15px;
      font-weight: bold;
    }

    .capo {
      color: green;
      font-weight: bold;
    }

    .lyric {
      color: black;
    }

    .song-menu {
      margin-bottom: 20px;
    }

    .song-menu button {
      display: block;
      width: 100%;
      margin-bottom: 5px;
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ddd;
      cursor: pointer;
    }

    .song-menu button:hover {
      background-color: #ddd;
    }

    .pionowo {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Śpiewnik</h1>

      <div class="pionowo">
        <div class="scroll-container" ref="scrollContainer">
          <pre ref="songText" v-html="formattedLyrics"></pre>
        </div>
        <div>
          <div class="controls">
            <div>
              <button @click="setScrollSpeed(0)">Stop</button>
              <button @click="setScrollSpeed(1)">Wolno</button>
              <button @click="setScrollSpeed(2)">Średnio</button>
              <button @click="setScrollSpeed(3)">Szybko</button>
            </div>
          </div>

          <div class="song-menu">
            <label>Wybierz piosenkę:</label>
            <div v-for="song in songs" :key="song">
              <button @click="loadSongByButton(song)">{{ song }}</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          songs: ["Ballada_o_maturze.txt", "Chryzantemy_zlociste.txt", "Dabi_Dam_Dam.txt", "Song_Zuza.txt"], // Przykładowe pliki
          lyrics: "",
          keyOffset: 0,
          scrollSpeed: 0,
          intervalId: null,
        };
      },
      computed: {
        formattedLyrics() {
          const lines = this.lyrics.split('\n');
          let output = '';

          if (lines.length > 0) {
            output += `<div class='strumming'>${lines[0]}</div>`;
          }

          if (lines.length > 1) {
            output += `<div class='capo'>${lines[1]}</div>`;
          }

          if (lines.length > 2) {
            output += `<div class='capo'>${lines[2]}</div><br>`;
          }

          for (let i = 4; i < lines.length; i++) {
            if (lines[i].trim() === '---') {
              output += '<br>';
            } else if (i % 2 === 0) {
              output += `<div class='chord'>${lines[i]}</div>`;
            } else {
              output += `<div class='lyric'>${lines[i]}</div>`;
            }
          }

          return output;
        }
      },
      methods: {
        loadSongByButton(song) {
          fetch(`songs/${song}`)
            .then(response => response.text())
            .then(data => {
              this.lyrics = data;
              this.keyOffset = 0; // Reset transpozycji
            })
            .catch(error => console.error("Błąd wczytywania piosenki:", error));
        },
        transpose(amount) {
          this.keyOffset += amount;
        },
        setScrollSpeed(speed) {
          clearInterval(this.intervalId);
          this.scrollSpeed = speed;
          if (speed > 0) {
            const scrollContainer = this.$refs.scrollContainer;
            const scrollStep = speed * 1;
            this.intervalId = setInterval(() => {
              scrollContainer.scrollTop += scrollStep;
              if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight) {
                clearInterval(this.intervalId);
              }
            }, 50);
          }
        }
      },
      beforeUnmount() {
        clearInterval(this.intervalId);
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
